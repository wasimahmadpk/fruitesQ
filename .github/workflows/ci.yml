name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Docker requires lowercase; repo may be wasimahmadpk/fruitesQ
  IMAGE_NAME: wasimahmadpk/fruitesq

jobs:
  # ── 1. Lint & Test ──────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── 2. Build & Push Docker image ────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to Google Cloud Run (main branch only) ─────────────────────────
  deploy-gcp:
    name: Deploy to GCP (Cloud Run)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Ensure GCS bucket for Terraform state
        run: |
          BUCKET="${{ secrets.GCP_PROJECT_ID }}-fruitq-tfstate"
          gcloud storage buckets describe gs://$BUCKET 2>/dev/null || \
          gcloud storage buckets create gs://$BUCKET --location=${{ secrets.GCP_REGION }} --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Terraform Init (GCP)
        working-directory: terraform-gcp
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_PROJECT_ID }}-fruitq-tfstate" \
            -backend-config="prefix=fruitq"

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe fruitq --location=${{ secrets.GCP_REGION }} 2>/dev/null || \
          gcloud artifacts repositories create fruitq \
            --repository-format=docker \
            --location=${{ secrets.GCP_REGION }} \
            --description="FruitQ container images"

      - name: Log in to GHCR and pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fruitq/api:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fruitq/api:latest

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fruitq/api:${{ github.sha }}
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fruitq/api:latest

      - name: Terraform Import existing resources (if any)
        working-directory: terraform-gcp
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: |
          PROJ="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ secrets.GCP_REGION }}"
          terraform import google_cloud_run_v2_service.api "projects/$PROJ/locations/$REGION/services/fruitq-api" 2>/dev/null || true
          terraform import google_cloud_run_v2_service.dashboard "projects/$PROJ/locations/$REGION/services/fruitq-dashboard" 2>/dev/null || true
          terraform import 'google_cloud_run_v2_service_iam_member.api_public' "projects/$PROJ/locations/$REGION/services/fruitq-api/roles/run.invoker/allUsers" 2>/dev/null || true
          terraform import 'google_cloud_run_v2_service_iam_member.dashboard_public' "projects/$PROJ/locations/$REGION/services/fruitq-dashboard/roles/run.invoker/allUsers" 2>/dev/null || true

      - name: Terraform Apply (GCP)
        working-directory: terraform-gcp
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve
